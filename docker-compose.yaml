services:
  db:
    image: postgres:16
    container_name: skachki-db
    environment:
      POSTGRES_USER: skachki
      POSTGRES_PASSWORD: skachki
      POSTGRES_DB: skachki
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skachki -d skachki"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    container_name: skachki
    hostname: skachki
    build:
      context: .
      dockerfile: Dockerfile
    image: skachki:latest
    ports:
      - "8080:8080"
    environment:
      STAND_NAME: test
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      DATABASE_URL: postgresql+psycopg://skachki:skachki@db:5432/skachki
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
