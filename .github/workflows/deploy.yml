name: Проверка развёртывания на Ubuntu

# Настоящее развёртывание стендов на Ubuntu 24.04 LTS: те же скрипты, которые
# применяются на виртуальных машинах в ЛР 2. Проверяются установка средств
# разработки, создание пользователя и службы systemd, запуск приложения.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-test:
    name: Стенд TEST (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка средств разработки
        run: sudo bash scripts/provision-ubuntu.sh

      - name: Развёртывание стенда
        run: sudo bash scripts/install-stand.sh test

      - name: Служба systemd активна
        run: systemctl is-active skachki

      # Проверяем, что включённая защита не сломала связность: базовые правила
      # ufw должны принимать ICMP echo-request до пользовательских правил.
      # Без этого проверка стендов «от всех ко всем» (check-stands.sh) не работает.
      - name: Межсетевой экран пропускает ping
        run: |
          echo "--- политика ufw ---"
          sudo ufw status verbose
          echo "--- базовые правила для ICMP ---"
          sudo grep -c 'icmp-type echo-request -j ACCEPT' /etc/ufw/before.rules
          sudo grep -q 'icmp-type echo-request -j ACCEPT' /etc/ufw/before.rules
          echo "ICMP echo-request разрешён базовыми правилами ufw."
          echo "--- проверка прохождения ping ---"
          ping -c 2 -W 3 127.0.0.1
          sudo ufw status | grep -q '8080/tcp'
          echo "Порт приложения открыт, защита включена."

      - name: Стенд отвечает
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"stand":"TEST"'

      - name: Вход под администратором
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -d 'username=admin&password=admin123' http://127.0.0.1:8080/login)
          echo "код ответа: $code"
          test "$code" = "303"

      - name: Журнал службы
        if: always()
        run: journalctl -u skachki --no-pager | tail -30

  deploy-stage:
    name: Стенд STAGE (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка средств разработки и PostgreSQL
        run: sudo bash scripts/provision-ubuntu.sh --with-postgres

      - name: Развёртывание стенда
        run: sudo bash scripts/install-stand.sh stage --with-postgres

      - name: Служба systemd активна
        run: systemctl is-active skachki

      - name: Стенд отвечает на PostgreSQL
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"dialect":"PostgreSQL"'

      - name: СУБД PostgreSQL
        run: systemctl is-active postgresql

      - name: Журнал службы
        if: always()
        run: journalctl -u skachki --no-pager | tail -30
