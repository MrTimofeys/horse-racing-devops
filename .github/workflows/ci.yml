name: Проверка проекта

# Автоматическая проверка при каждом изменении в репозитории.
# Набор тестов выполняется на обеих поддерживаемых СУБД, чтобы стенды TEST
# (SQLite) и STAGE/PROD (PostgreSQL) не разошлись в поведении.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-sqlite:
    name: Тесты на SQLite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Версии установленных средств
        run: |
          python --version
          pip --version

      - name: Тесты
        run: pytest -q

  tests-postgresql:
    name: Тесты на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skachki
          POSTGRES_PASSWORD: skachki
          POSTGRES_DB: skachki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://skachki:skachki@127.0.0.1:5432/skachki_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt -r requirements-postgres.txt

      - name: Тесты
        run: pytest -q

      # Подсистема резервного копирования и восстановления (ТЗ) на PostgreSQL:
      # проверяем полный цикл — копия, изменение данных, восстановление.
      # Все команды Python однострочные: многострочный код внутри YAML-блока
      # получил бы лишние отступы и не собрался бы.
      - name: Резервное копирование и восстановление на PostgreSQL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

          count() {
            python -c "import os, sqlalchemy as sa; print(sa.create_engine(os.environ['DATABASE_URL']).connect().execute(sa.text('SELECT COUNT(*) FROM horses')).scalar())"
          }

          echo "==> Схема и начальные данные"
          python -m app.cli seed

          BEFORE="$(count)"
          echo "лошадей до копии: ${BEFORE}"

          echo "==> Создание копии"
          bash scripts/backup.sh
          BACKUP_FILE="$(ls -t backups/*.gz | head -1)"
          echo "копия: ${BACKUP_FILE}"

          echo "==> Изменение данных"
          python -c "from app import crud; from app.database import SessionLocal; db = SessionLocal(); crud.create_horse(db, name='Проверочная лошадь', sex='кобыла', age=4, owner_id=None); db.close()"
          CHANGED="$(count)"
          echo "лошадей после изменения: ${CHANGED}"
          test "${CHANGED}" -gt "${BEFORE}"

          echo "==> Восстановление из копии"
          RESTART_SERVICE=0 bash scripts/backup.sh --restore "${BACKUP_FILE}"

          AFTER="$(count)"
          echo "лошадей после восстановления: ${AFTER}"
          test "${AFTER}" -eq "${BEFORE}"
          echo "Восстановление на PostgreSQL подтверждено."

  deploy-scripts:
    name: Самопроверка скриптов развёртывания
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # check-deploy.sh сам создаёт виртуальное окружение и ставит зависимости,
      # поэтому отдельная установка не нужна.
      - name: Стенд TEST (SQLite)
        run: bash scripts/check-deploy.sh test

      - name: Стенд STAGE (PostgreSQL)
        run: bash scripts/check-deploy.sh stage --with-postgres

      - name: Стенд PROD (PostgreSQL)
        run: bash scripts/check-deploy.sh prod --with-postgres

      - name: Синтаксис служебных скриптов
        run: |
          for script in scripts/*.sh; do
            echo "проверка $script"
            bash -n "$script"
          done
